# 組み込みのプラグインの処理部分。wasm32-wasip2 で WASM のコンポーネントにし、アプリ（src-tauri/build.rs）が組み込む
[workspace]
members = ["image", "video", "audio", "archive"]
resolver = "3"

# wit_bindgen::generate! が作るコードに、引数の多い関数がある
[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 展開は大きなファイルを扱うので、大きさより速さを優先する
[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.libbz2-rs-sys]
opt-level = 3

[profile.release.package.lzma-rust2]
opt-level = 3

[profile.release.package.ppmd-rust]
opt-level = 3

[profile.release.package.rars]
opt-level = 3

[profile.release.package.ruzstd]
opt-level = 3

[profile.release.package.sevenz-rust2]
opt-level = 3
