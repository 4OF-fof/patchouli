[package]
name = "patchouli-plugin-audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "flac", "pcm", "adpcm", "id3v2"] }
wit-bindgen = "0.63"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true
