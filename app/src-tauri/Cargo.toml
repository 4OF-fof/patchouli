[package]
name = "patchouli"
version = "0.1.0"
description = "Patchouli"
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "patchouli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
serde_yaml_ng = { version = "0.10.0", default-features = false }
imagesize = "0.15.0"
uuid = { version = "1.29.0", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
tauri-plugin-dialog = "2.8.3"
kamadak-exif = "0.6.1"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
sha2 = "0.11.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
trash = "5.2.9"

# 開発中も画像の読み込みと縮小が遅くならないよう、依存クレートは最適化してビルドする
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_Foundation",
] }
