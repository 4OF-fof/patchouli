# 例のプラグイン。scripts/dev-library.ts が wasm32-wasip2 でビルドし、example/dev-plugins/ に入れる
[workspace]
members = ["example_autolink-plugin", "example_collect-plugin", "example_graph-plugin", "example_psd-plugin", "example_zip-plugin"]
resolver = "3"

# wit_bindgen::generate! が作るコードに、引数の多い関数がある
[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
